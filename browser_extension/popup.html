<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px; margin: 0; padding: 16px; background: #f8f9fb; color: #1a1a2e;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 12px; margin: 0 0 14px; }
    button {
      width: 100%; padding: 11px 14px; margin-bottom: 8px; border: none;
      border-radius: 10px; font: 600 14px inherit; cursor: pointer;
    }
    .primary { background: #f59e0b; color: #1a1a2e; }
    .primary:hover { background: #d97706; }
    .ghost { background: #eef0f4; color: #1a1a2e; }
    .ghost:hover { background: #e2e6ee; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 10px; font-size: 13px; min-height: 18px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    .results { margin-top: 8px; font-size: 12px; }
    .results div { padding: 4px 0; border-top: 1px solid #e5e7eb; }
    .cfg { margin-top: 12px; font-size: 11px; color: #9ca3af; text-align: center; }
    .cfg a { color: #9ca3af; }
  </style>
</head>
<body>
  <h1>🏇 Kungens Trav</h1>
  <p class="sub">Skickar tips & intervjuer från inloggade sajter.</p>

  <button id="btn-this" class="primary">📋 Hämta denna flik</button>
  <button id="btn-all" class="ghost">🗂️ Hämta alla öppna tipsflikar</button>

  <div id="status"></div>
  <div id="results" class="results"></div>

  <div class="cfg"><a href="#" id="open-options">⚙️ Inställningar</a></div>

  <script src="popup.js"></script>
</body>
</html>
