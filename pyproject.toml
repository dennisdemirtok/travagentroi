[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trav-agent"
version = "0.1.0"
description = "AI-driven travanalys för svensk travsport"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
trav-agent = "trav_agent.cli:cli"

[tool.setuptools.packages.find]
include = ["trav_agent*"]
